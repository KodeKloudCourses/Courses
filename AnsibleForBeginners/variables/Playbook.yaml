-
  name: Add DNS server to resolv.conf
  hosts: localhost
  vars:
    dns_server: 10.1.250.10
  tasks:
    - lineinfile:
        path: /etc/resolv.conf
        line: 'nameserver {{ dns_server}}'


# Another example 
-
  name: Set Firewall Configurations
  hosts: web
  tasks:
  - firewalld:
      service: https 
      permanent: true
      state: enabled

  - firewalld:
      port: '{{http_port}}'/tcp 
      permanent: true
      state: disabled

  - firewalld:
      port: '{{snmp_port}}'/udp 
      permanent: true
      state: disabled

  - firewalld:
      port: '{{inter_ip_range}}'/24 
      permanent: internal
      state: disabled


# Sample Inventory File
Web http_port=8081 snmp_port=161-162 inter_ip_range=192.0.2.0

# Sample variable File - web.yml 
http_port: 8081
snmp_port: 161-162
inter_ip_range: 192.0.2.0